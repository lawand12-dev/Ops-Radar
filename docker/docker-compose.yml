version: "3.9"
services:
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: opsradar
      MYSQL_USER: opsradar
      MYSQL_PASSWORD: opsradarpass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsradar_vectors
      POSTGRES_USER: opsradar
      POSTGRES_PASSWORD: opsradarpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsradar -d opsradar_vectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://opsradar:opsradarpass@postgres:5432/opsradar_vectors
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../public:/app/public:ro
      - ../knowledge-base:/app/knowledge-base:ro

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["bun", "src/worker.ts"]
    env_file: ../.env
    environment:
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://opsradar:opsradarpass@postgres:5432/opsradar_vectors
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  postgres_data:
