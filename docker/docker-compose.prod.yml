version: "3.9"
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api

  api:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  mysql:
    restart: always

  redis:
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  postgres:
    restart: always
