openapi: 3.1.0
info:
  title: Ops-Radar AI Automation Builder API
  version: 0.1.0
  description: |
    HTTP API for **Ops-Radar / AI Automation Builder** — a service that turns natural-language
    requests into n8n workflows, deploys them to a remote n8n instance, monitors their health,
    and surfaces alerts, executions, and AI-generated remediation guidance.

    ## Architecture

    The service is a single Hono-based HTTP server (Bun or Node runtime) that exposes the
    following functional surfaces:

    - **/chat** — turn a free-text instruction into a validated, persisted n8n workflow.
    - **/projects** — manage projects (one project ≈ one workflow), inspect their lifecycle,
      bind n8n credentials per node, run deploy preflight, deploy/redeploy, fix rejected
      workflows, fetch executions and health.
    - **/workflows** — read low-level workflow status, recent failures, alerts, and the
      latest AI failure-analysis suggestion.
    - **/event** — webhook-style event ingestion endpoint for run/node lifecycle signals
      pushed from n8n or other workers; protected by `EVENT_INGEST_TOKEN`.
    - **/analytics** — aggregated KPIs across projects and workflows.
    - **/n8n** — proxy / facade over the n8n REST API for credentials and credential schemas.
    - **/health** — liveness and feature-flag readout.
    - **/debug/** — development-only diagnostics (knowledge-base selection, workflow drift).

    ## Authentication

    Most endpoints currently rely on **deployment-level network controls** (private network,
    reverse-proxy auth, etc.). The only application-level credential check today is on
    `POST /event`, which requires a static bearer token (`EVENT_INGEST_TOKEN`) in production.

    ## Versioning

    Routes are not currently versioned in the URL — this is `v0.1.0`. Schema changes are
    additive whenever possible. Breaking changes will be announced via tag and changelog.

    ## Error Format

    All errors are returned in a consistent envelope:

    ```json
    { "error": { "code": "BAD_REQUEST", "message": "Invalid request body.", "details": [] } }
    ```

    `details` is omitted when the error is `>= 500` (sensitive payloads are not echoed).
    Validation issues come from Zod and follow the
    [Zod issue shape](https://zod.dev/?id=error-handling).

  contact:
    name: Ops-Radar Maintainers
  license:
    name: Proprietary

servers:
  - url: http://localhost:{port}
    description: Local development server
    variables:
      port:
        default: "3000"
        description: HTTP port from `PORT` env (default 3000)
  - url: https://api.ops-radar.example.com
    description: Production API (replace with your deployment hostname)

tags:
  - name: Health
    description: Liveness / readiness probes and static assets.
  - name: Chat
    description: Generate workflows from natural-language messages.
  - name: Projects
    description: Project lifecycle, deploy preflight, deploy, credential bindings, executions.
  - name: Workflows
    description: Low-level workflow status, runs, alerts, AI suggestions.
  - name: Events
    description: Webhook-style ingestion of run/node lifecycle events from n8n.
  - name: Analytics
    description: Cross-project, cross-workflow aggregated KPIs.
  - name: n8n
    description: Facade over the configured n8n REST API (credentials and schemas).
  - name: Debug
    description: Development-only diagnostics. Returns 404 in non-development.

security: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      description: |
        Returns service liveness, runtime feature flags relevant to deployment, and a
        UTC ISO timestamp. Useful for load-balancer / k8s probes.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: ai-automation-builder
                timestamp: "2026-05-08T10:15:00.000Z"
                monitoring_enabled: true
                credential_provisioning_mode: manual_only

  /:
    get:
      tags: [Health]
      operationId: getIndexPage
      summary: Static index page
      description: Serves `public/index.html` (the bundled web UI).
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /app.css:
    get:
      tags: [Health]
      operationId: getAppCss
      summary: Static CSS bundle
      responses:
        "200":
          description: CSS bundle.
          content:
            text/css:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /app.js:
    get:
      tags: [Health]
      operationId: getAppJs
      summary: Static JS bundle
      responses:
        "200":
          description: JS bundle.
          content:
            application/javascript:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /chat:
    post:
      tags: [Chat]
      operationId: createChatWorkflow
      summary: Generate, validate and persist a workflow from a natural-language message
      description: |
        Sends a natural-language request to the AI provider, asks it to generate a complete
        n8n workflow JSON, runs the security validator on the result, and persists the
        project, chat session, user/assistant messages and workflow as a single transaction.

        ### Workflow lifecycle

        - If validation passes, the workflow is stored with status `validated`.
        - If validation fails, the workflow is stored with status `rejected`, secrets are
          redacted from the JSON, and `validation.errors` lists the failures.

        ### Tracing

        Pass `x-trace-id` to thread your request id through logs and the response. If
        omitted, the server generates one and echoes it back via the `x-trace-id` header.
      parameters:
        - $ref: "#/components/parameters/TraceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              telegramToGmail:
                summary: Forward Telegram message to Gmail
                value:
                  message: When I receive a Telegram message, send the body to my Gmail inbox.
              dailyReport:
                summary: Daily KPI digest
                value:
                  message: Every day at 9am, fetch yesterday's stats from Postgres and email a summary to ops@acme.com.
      responses:
        "201":
          description: Workflow generated, validated (or rejected), and persisted.
          headers:
            x-trace-id:
              description: Echo of the request trace id.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResult"
              example:
                project_id: c0a8a2bb-9b71-4f7b-8e23-43e11c9bda1c
                session_id: 3a92dc2c-3a3d-4f0e-aafb-7a5c6f4e8a01
                project_name: Telegram → Gmail forwarder
                description: Forwards new Telegram messages to a Gmail inbox.
                workflow:
                  name: Telegram → Gmail forwarder
                  nodes: []
                  connections: {}
                  settings: {}
                validation:
                  valid: true
                  errors: []
                trace_id: 84a19a13-5f60-4f4f-9af9-4aaf1a1b1f01
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects with workflow + health snapshot
      description: |
        Paginated list of projects with the **latest workflow per project**, a compact
        health snapshot, and an optional live n8n sync check (controlled by the
        `verify_n8n` query parameter or by the `PROJECTS_VERIFY_N8N_ON_LIST` env flag).
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/VerifyN8nQuery"
      responses:
        "200":
          description: List page.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectListItem"
                  count:
                    type: integer
                    description: Number of items on this page (not the total).
        "400":
          $ref: "#/components/responses/BadRequest"

  /projects/report:
    get:
      tags: [Projects]
      operationId: getProjectsAuditReport
      summary: Cross-project audit report
      description: |
        Returns a snapshot suitable for an audit dashboard: per-project lifecycle state,
        n8n existence/active flags, credential coverage, recommended next action, and
        node-version compatibility info. Default page size is 200.

        Always performs a live n8n verification unless `verify_n8n=false` is provided.
      parameters:
        - $ref: "#/components/parameters/LimitQueryReport"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/VerifyN8nQuery"
      responses:
        "200":
          description: Audit report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsAuditReport"
        "400":
          $ref: "#/components/responses/BadRequest"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project with its latest workflow and health
      responses:
        "200":
          description: Project + workflow snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWithWorkflow"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project and best-effort clean up its n8n workflows
      description: |
        Deactivates and deletes every n8n workflow attached to the project's workflows,
        then deletes the project row in the local DB. Remote failures (other than "not
        found") are surfaced as `cleanup_warnings` while the local delete still succeeds.
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteProjectResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/workflow:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      tags: [Projects]
      operationId: getProjectWorkflow
      summary: Get the project's latest workflow record
      responses:
        "200":
          description: Workflow record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/messages:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      tags: [Projects]
      operationId: getProjectMessages
      summary: Get chat history for a project
      responses:
        "200":
          description: Chat messages, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [project_id, messages]
                properties:
                  project_id:
                    type: string
                    format: uuid
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      tags: [Projects]
      operationId: getProjectActivity
      summary: Get recent workflow events / activity for a project
      parameters:
        - name: limit
          in: query
          description: Maximum number of events to return (default 100).
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
      responses:
        "200":
          description: Recent events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectActivity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/credential-bindings:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      tags: [Projects]
      operationId: getProjectCredentialBindings
      summary: Get credential bindings (per-node) for the project's latest workflow
      responses:
        "200":
          description: Bindings (both new and legacy shapes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialBindingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      operationId: saveProjectCredentialBindings
      summary: Replace credential bindings for the project's latest workflow
      description: |
        Replaces all stored bindings for the latest workflow. Bindings can be supplied as:

        - `bindings` (preferred) — array of `NodeCredentialBinding`.
        - `credential_bindings` — same array shape, kept for compatibility.
        - A legacy `Record<credentialType, { id?, name? }>` map is also accepted under
          either key.

        Saving bindings resets the project status to `draft`. Rejected workflows cannot
        accept bindings — fix them via `POST /projects/{projectId}/fix-workflow` first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCredentialBindingsRequest"
            examples:
              perNode:
                summary: Per-node array form
                value:
                  bindings:
                    - node_id: "1234"
                      node_name: Gmail
                      credential_type: gmailOAuth2
                      id: "42"
                      name: Gmail (Ops)
              legacy:
                summary: Legacy by-type record form
                value:
                  bindings:
                    gmailOAuth2:
                      id: "42"
                      name: Gmail (Ops)
      responses:
        "200":
          description: Updated bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialBindingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Workflow rejected — fix it before binding credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/deploy-check:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    post:
      tags: [Projects]
      operationId: deployPreflight
      summary: Deploy preflight — what's needed to deploy/activate
      description: |
        Returns a full deploy preflight: required credentials per node, which bindings
        are resolved against live n8n credentials, missing/manual credentials, capabilities
        (`can_deploy_inactive`, `can_activate`, `can_redeploy`, `can_delete`), and links
        to the n8n dashboard. Useful to drive the deploy UI.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployCheckRequest"
            example:
              credential_bindings:
                - credential_type: gmailOAuth2
                  id: "42"
      responses:
        "200":
          description: Preflight result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployPreflightResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Workflow rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/deploy:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    post:
      tags: [Projects]
      operationId: deployProject
      summary: Deploy (and optionally activate) the project's latest workflow to n8n
      description: |
        Creates or updates the workflow on the configured n8n instance, persists the
        canonical normalized JSON in the local DB, optionally activates the workflow,
        emits lifecycle events (`workflow_deployed`, `workflow_activated`,
        `workflow_deactivated`).

        ### Concurrency

        Concurrent deploys for the same project are rejected with `DEPLOY_IN_PROGRESS`
        (HTTP 409) to prevent orphaning workflows on n8n.

        ### Failure modes

        - `WORKFLOW_NOT_FOUND` (400) — project has no workflow.
        - `WORKFLOW_REJECTED` (409) — fix validation errors first.
        - `WORKFLOW_NOT_DEPLOYABLE` (400) — current status is not deployable.
        - `N8N_CREDENTIALS_PRECHECK_FAILED` (502) — could not reach n8n credentials.
        - `CREDENTIAL_BINDINGS_REQUIRED` (409) — missing bindings; activate denied.
        - `N8N_MISSING_CREDENTIALS` (409) — n8n returned a missing-credential error
          on activation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
            example:
              activate: true
              credential_bindings:
                - credential_type: gmailOAuth2
                  id: "42"
      responses:
        "200":
          description: Deploy result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Workflow not deployable, rejected, missing bindings, or in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: n8n upstream error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/fix-workflow:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    post:
      tags: [Projects]
      operationId: fixProjectWorkflow
      summary: Ask the AI to fix a rejected workflow
      description: |
        Re-runs the AI generator on the original chat request plus the validation errors,
        re-validates the result, and updates the workflow row. Only available when the
        latest workflow has `status = "rejected"`.
      responses:
        "200":
          description: Fix result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixWorkflowResult"
              example:
                workflow_id: 9b41a3a0-a1aa-4ffd-94aa-13d7fb0a2c10
                workflow_status: validated
                validation_errors: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Workflow is not rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/health:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      tags: [Projects]
      operationId: getProjectHealth
      summary: Get the project workflow's full health snapshot
      description: |
        Reaches out to n8n, lists recent executions, classifies the latest failure (if any)
        with the error classifier, persists a `workflow_health_snapshots` row, opens or
        resolves alerts as appropriate, and emits `workflow_execution_*` and
        `workflow_health_*` events.
      responses:
        "200":
          description: Health snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkflowHealth"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/health/refresh:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    post:
      tags: [Projects]
      operationId: refreshProjectHealth
      summary: Force-refresh the project workflow's health snapshot
      description: Same as `GET /projects/{projectId}/health` but always recomputes.
      responses:
        "200":
          description: Health snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkflowHealth"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/executions:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      tags: [Projects]
      operationId: listProjectExecutions
      summary: List recent n8n executions for the project workflow
      parameters:
        - name: limit
          in: query
          required: false
          description: Max executions to return (1–100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          description: Optional n8n status filter (e.g. `error`, `success`, `running`).
          schema:
            type: string
      responses:
        "200":
          description: Execution list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExecutions"
        "400":
          description: Workflow not deployed yet, or invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/executions/{executionId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
      - name: executionId
        in: path
        required: true
        description: n8n execution id.
        schema:
          type: string
    get:
      tags: [Projects]
      operationId: getProjectExecutionDetails
      summary: Get a single n8n execution with classified-error info and a redacted detail view
      responses:
        "200":
          description: Execution details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExecutionDetails"
        "400":
          description: Workflow not deployed yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Execution does not belong to this project workflow, or project missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workflows/{workflowId}/status:
    parameters:
      - name: workflowId
        in: path
        required: true
        description: Internal workflow UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Workflows]
      operationId: getWorkflowStatus
      summary: Low-level workflow status, run stats, recent errors, alerts and AI suggestion
      responses:
        "200":
          description: Workflow status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /event:
    post:
      tags: [Events]
      operationId: ingestWorkflowEvent
      summary: Ingest a workflow run/node lifecycle event
      description: |
        Webhook-style endpoint for run/node lifecycle and workflow lifecycle events.

        ### Authentication

        When `EVENT_INGEST_TOKEN` is set on the server (required in production), one of
        the following must match it:

        - `Authorization: Bearer <token>`, or
        - `X-Event-Token: <token>`

        ### Workflow resolution

        Provide either `workflow_id` (internal UUID) or `n8n_workflow_id`. If neither
        resolves to a workflow, the request fails with 404 / `WORKFLOW_NOT_FOUND`.

        ### Side effects

        - `run_failed` flips the workflow + project to `failed` and runs the
          AI failure-analyzer (best-effort).
        - `run_succeeded` recovers a `failed` workflow back to `deployed_active` and
          flips the project to `active`.
        - `workflow_deactivated` / `workflow_deleted` adjust workflow + project state.
      security:
        - bearerAuth: []
        - eventTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingWorkflowEvent"
            examples:
              runFailed:
                summary: Run failed
                value:
                  workflow_id: 9b41a3a0-a1aa-4ffd-94aa-13d7fb0a2c10
                  run_id: exec-2025-05-08-12345
                  event_type: run_failed
                  status: failure
                  severity: high
                  error_message: "ECONNREFUSED 127.0.0.1:5432"
                  metadata:
                    region: eu-west-1
              runSucceeded:
                summary: Run succeeded
                value:
                  n8n_workflow_id: "1273"
                  run_id: exec-2025-05-08-12345
                  event_type: run_succeeded
                  duration_ms: 4321
      responses:
        "202":
          description: Accepted and persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventIngestResult"
              example:
                accepted: true
                workflow_id: 9b41a3a0-a1aa-4ffd-94aa-13d7fb0a2c10
                event_id: 3ccb5d92-6a74-4d5d-9f29-98f0d3bce8d0
                analysis_error: null
        "400":
          $ref: "#/components/responses/BadEventPayload"
        "401":
          description: Token missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: UNAUTHORIZED_EVENT
                  message: Invalid event token.
        "404":
          $ref: "#/components/responses/WorkflowNotFound"

  /analytics:
    get:
      tags: [Analytics]
      operationId: getAnalyticsSnapshot
      summary: Cross-workflow analytics snapshot
      description: |
        High-level KPIs (totals, success rate, average duration), per-workflow health
        ranking sorted by unresolved alerts then failed runs (top 20).
      responses:
        "200":
          description: Analytics snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSnapshot"

  /n8n/credentials:
    get:
      tags: [n8n]
      operationId: listN8nCredentials
      summary: List credentials registered on the configured n8n instance
      responses:
        "200":
          description: Credential list.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/N8nCredentialSummary"
                  count:
                    type: integer
        "500":
          description: n8n config error or upstream failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [n8n]
      operationId: createN8nCredential
      summary: Create an n8n credential (currently rejected — manual-only)
      description: |
        This endpoint validates input and surfaces a 409 explaining that credential
        provisioning is **manual-only**. It exists so clients can ask the server which
        credential types are required by a project's workflow and receive a structured
        response that points to the n8n dashboard to create them.

        - `WORKFLOW_NOT_FOUND` (400) — project has no workflow.
        - `WORKFLOW_REJECTED` (409) — fix validation first.
        - `CREDENTIAL_MANUAL_ONLY` (409) — server is in `manual_only` provisioning mode.
        - `CREDENTIAL_TYPE_NOT_REQUIRED` (409) — that type isn't in the workflow.
        - `CREDENTIAL_CREATION_MANUAL_REQUIRED` (409) — manual-only fallback (default).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateN8nCredentialRequest"
      responses:
        "409":
          description: Manual provisioning required (or workflow rejected / type not required).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /n8n/credentials/schema/{credentialType}:
    parameters:
      - name: credentialType
        in: path
        required: true
        description: n8n credential type (e.g. `gmailOAuth2`, `httpBasicAuth`).
        schema:
          type: string
    get:
      tags: [n8n]
      operationId: getN8nCredentialPolicy
      summary: Get the local provisioning policy for a credential type
      description: |
        Returns the **server's policy** for this credential type. Today every credential
        type uses provisioning mode `manual`, meaning credentials must be created in n8n
        and bound here by id or name — there is no API path to create credentials from
        Ops-Radar.
      responses:
        "200":
          description: Policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialPolicyResponse"
              example:
                credential_type: gmailOAuth2
                label: Gmail O Auth2
                provisioning_mode: manual
                fields: []
                manual_message: Create or complete this credential inside n8n, then bind it here by credential id or name.

  /debug/knowledge-base:
    get:
      tags: [Debug]
      operationId: debugKnowledgeBase
      summary: Inspect knowledge-base selection for a query (dev only)
      description: Available only when `NODE_ENV=development`. Returns 404 otherwise.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Selection breakdown.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"

  /debug/workflow/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      tags: [Debug]
      operationId: debugWorkflowDrift
      summary: Compare DB workflow vs n8n workflow (dev only)
      parameters:
        - name: verify_n8n
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Drift snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkflowDebugSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"

  /debug/workflow/{projectId}/node-versions:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      tags: [Debug]
      operationId: debugNodeVersions
      summary: Compare node-type versions DB vs n8n (dev only)
      parameters:
        - name: verify_n8n
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Node-version subset of the drift snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Static token configured via `EVENT_INGEST_TOKEN`. Currently only used by `POST /event`.
    eventTokenAuth:
      type: apiKey
      in: header
      name: X-Event-Token
      description: Alternative to `Authorization: Bearer …` for `POST /event`.

  parameters:
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      description: Project UUID.
      schema:
        type: string
        format: uuid
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Page size (default 20, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LimitQueryReport:
      name: limit
      in: query
      required: false
      description: Page size for the audit report (default 200, max 1000 in practice).
      schema:
        type: integer
        minimum: 1
        default: 200
    OffsetQuery:
      name: offset
      in: query
      required: false
      description: Page offset.
      schema:
        type: integer
        minimum: 0
        default: 0
    VerifyN8nQuery:
      name: verify_n8n
      in: query
      required: false
      description: |
        If `true`, the server also reaches out to n8n to verify each workflow's existence
        and active flag. If omitted, follows `PROJECTS_VERIFY_N8N_ON_LIST` for `/projects`
        and defaults to `true` for `/projects/report`.
      schema:
        type: boolean
    TraceIdHeader:
      name: x-trace-id
      in: header
      required: false
      description: Distributed-trace correlation id. If absent, the server generates one.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation or input error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: BAD_REQUEST
              message: Invalid request body.
              details:
                - code: too_small
                  minimum: 3
                  type: string
                  inclusive: true
                  exact: false
                  message: String must contain at least 3 character(s)
                  path: [message]
    BadEventPayload:
      description: Invalid event payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: BAD_EVENT_PAYLOAD
              message: Invalid event payload.
              details: []
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Route not found.
    WorkflowNotFound:
      description: Workflow could not be resolved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: WORKFLOW_NOT_FOUND
              message: Unable to resolve workflow. Provide workflow_id or n8n_workflow_id.
    InternalError:
      description: Internal server error. Sensitive details are stripped.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error.

  schemas:
    # ---------- Error envelope ----------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              examples: [BAD_REQUEST, WORKFLOW_NOT_FOUND, UNAUTHORIZED_EVENT, INTERNAL_ERROR]
            message:
              type: string
              description: Human-readable message; safe to surface in UIs.
            details:
              description: |
                Optional structured details. Present only for `4xx` responses.
                For Zod-driven validation errors, this is the `error.issues` array.
              nullable: true

    # ---------- Health ----------
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
        - monitoring_enabled
        - credential_provisioning_mode
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [ai-automation-builder]
        timestamp:
          type: string
          format: date-time
        monitoring_enabled:
          type: boolean
        credential_provisioning_mode:
          type: string
          enum: [hybrid, manual_only]

    # ---------- Enums ----------
    ProjectStatus:
      type: string
      enum: [draft, active, failed]
    WorkflowStatus:
      type: string
      enum: [draft, validated, rejected, deployed_inactive, deployed_active, failed]
    WorkflowLifecycleState:
      type: string
      enum:
        - draft
        - validated
        - rejected
        - deployed_inactive
        - deployed_active
        - failed
        - missing_in_n8n
        - n8n_check_failed
        - no_workflow
    HealthStatus:
      type: string
      enum: [healthy, warning, failing, inactive, unknown]
    ChatRole:
      type: string
      enum: [user, ai]
    EventType:
      type: string
      enum:
        - run_started
        - run_succeeded
        - run_failed
        - node_started
        - node_succeeded
        - node_failed
        - workflow_created
        - workflow_validated
        - workflow_rejected
        - workflow_deployed
        - workflow_activated
        - workflow_deactivated
        - workflow_deleted
        - workflow_execution_success
        - workflow_execution_failed
        - workflow_health_warning
        - workflow_health_failing
        - workflow_alert_created
        - workflow_alert_resolved
    Severity:
      type: string
      enum: [low, medium, high]
    EventStatus:
      type: string
      enum: [success, failure, info]
    AlertStatus:
      type: string
      enum: [open, resolved]
    CredentialProvisioningMode:
      type: string
      enum: [manual]
    CredentialFieldType:
      type: string
      enum: [text, password, number, boolean]

    # ---------- Chat ----------
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 3
          description: Natural-language description of the desired automation.
    ChatResult:
      type: object
      required:
        - project_id
        - session_id
        - project_name
        - description
        - workflow
        - validation
      properties:
        project_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        project_name:
          type: string
        description:
          type: string
        workflow:
          $ref: "#/components/schemas/N8nWorkflow"
        validation:
          $ref: "#/components/schemas/ValidationResult"
        trace_id:
          type: string
          nullable: true
    ValidationResult:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string

    # ---------- n8n workflow domain ----------
    N8nNode:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          description: n8n node type, e.g. `n8n-nodes-base.gmail`.
        typeVersion:
          type: number
          nullable: true
        position:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
        parameters:
          type: object
          additionalProperties: true
        credentials:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CredentialRef"
    N8nConnectionTarget:
      type: object
      required: [node, type, index]
      properties:
        node:
          type: string
        type:
          type: string
        index:
          type: integer
    N8nConnections:
      type: object
      additionalProperties:
        type: object
        properties:
          main:
            type: array
            items:
              type: array
              items:
                $ref: "#/components/schemas/N8nConnectionTarget"
    N8nWorkflow:
      type: object
      required: [nodes, connections, settings]
      properties:
        name:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/N8nNode"
        connections:
          $ref: "#/components/schemas/N8nConnections"
        settings:
          type: object
          additionalProperties: true

    # ---------- Project / workflow records ----------
    ProjectRecord:
      type: object
      required: [id, name, description, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkflowRecord:
      type: object
      required: [id, project_id, json, status, validation_errors, n8n_workflow_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        json:
          $ref: "#/components/schemas/N8nWorkflow"
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        validation_errors:
          type: array
          nullable: true
          items:
            type: string
        n8n_workflow_id:
          type: string
          nullable: true
        last_deployed_at:
          type: string
          format: date-time
          nullable: true
        last_activated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkflowSummary:
      type: object
      required: [id, status, created_at, n8n_workflow_id]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        created_at:
          type: string
          format: date-time
        n8n_workflow_id:
          type: string
          nullable: true
    HealthSummary:
      type: object
      required: [is_working, last_run_status, unresolved_alerts]
      properties:
        is_working:
          type: boolean
        last_run_status:
          type: string
          enum: [success, failure, unknown]
        unresolved_alerts:
          type: integer
    N8nSyncSummary:
      type: object
      required: [checked, exists, active, workflow_name, error]
      properties:
        checked:
          type: boolean
        exists:
          type: boolean
          nullable: true
        active:
          type: boolean
          nullable: true
        workflow_name:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
    ProjectListItem:
      type: object
      required: [project, workflow, health, lifecycle_state, n8n_sync]
      properties:
        project:
          $ref: "#/components/schemas/ProjectRecord"
        workflow:
          oneOf:
            - $ref: "#/components/schemas/WorkflowSummary"
            - type: "null"
        health:
          oneOf:
            - $ref: "#/components/schemas/HealthSummary"
            - type: "null"
        lifecycle_state:
          $ref: "#/components/schemas/WorkflowLifecycleState"
        n8n_sync:
          $ref: "#/components/schemas/N8nSyncSummary"
    ProjectWithWorkflow:
      type: object
      required: [project, workflow, health]
      properties:
        project:
          $ref: "#/components/schemas/ProjectRecord"
        workflow:
          oneOf:
            - $ref: "#/components/schemas/WorkflowRecord"
            - type: "null"
        health:
          oneOf:
            - type: object
              required: [is_working, last_run_status, last_run_at, recent_errors, ai_suggestion]
              properties:
                is_working:
                  type: boolean
                last_run_status:
                  type: string
                  enum: [success, failure, unknown]
                last_run_at:
                  type: string
                  format: date-time
                  nullable: true
                recent_errors:
                  type: array
                  items:
                    $ref: "#/components/schemas/RecentError"
                ai_suggestion:
                  oneOf:
                    - $ref: "#/components/schemas/AiSuggestion"
                    - type: "null"
            - type: "null"
    RecentError:
      type: object
      required: [run_id, node_name, error_message, created_at]
      properties:
        run_id:
          type: string
          nullable: true
        node_name:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AiSuggestion:
      type: object
      required: [issue, reason, solution, created_at]
      properties:
        issue:
          type: string
        reason:
          type: string
        solution:
          type: string
        created_at:
          type: string
          format: date-time

    # ---------- Audit report ----------
    NormalizedNodeVersionInfo:
      type: object
      additionalProperties: true
      description: |
        Normalized node-type / typeVersion descriptor produced by the n8n compatibility
        helper. Shape is informational and may include fields like `node_type`,
        `current_version`, `latest_known_version`.
    IncompatibleNodeInfo:
      type: object
      additionalProperties: true
      description: |
        Description of a node whose version or type is not compatible with the targeted
        n8n instance.
    ProjectAuditItem:
      type: object
      required:
        - project_id
        - project_name
        - workflow_id
        - workflow_status
        - lifecycle_state
        - n8n_workflow_id
        - n8n_exists
        - n8n_active
        - n8n_workflow_url
        - n8n_credentials_url
        - required_credentials_count
        - missing_credentials_count
        - manual_credentials_count
        - health_status
        - recommended_action
        - can_deploy_inactive
        - can_activate
        - can_redeploy
        - can_delete
        - node_types_with_versions
        - normalized_node_versions
        - incompatible_nodes
      properties:
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        workflow_id:
          type: string
          format: uuid
          nullable: true
        workflow_status:
          oneOf:
            - $ref: "#/components/schemas/WorkflowStatus"
            - type: "null"
        lifecycle_state:
          $ref: "#/components/schemas/WorkflowLifecycleState"
        n8n_workflow_id:
          type: string
          nullable: true
        n8n_exists:
          type: boolean
          nullable: true
        n8n_active:
          type: boolean
          nullable: true
        n8n_workflow_url:
          type: string
          format: uri
          nullable: true
        n8n_credentials_url:
          type: string
          format: uri
        required_credentials_count:
          type: integer
        missing_credentials_count:
          type: integer
        manual_credentials_count:
          type: integer
        health_status:
          type: string
          enum: [healthy, warning, failing, unknown]
        recommended_action:
          type: string
        can_deploy_inactive:
          type: boolean
        can_activate:
          type: boolean
        can_redeploy:
          type: boolean
        can_delete:
          type: boolean
        node_types_with_versions:
          type: array
          items:
            type: string
        normalized_node_versions:
          type: array
          items:
            $ref: "#/components/schemas/NormalizedNodeVersionInfo"
        incompatible_nodes:
          type: array
          items:
            $ref: "#/components/schemas/IncompatibleNodeInfo"
    ProjectsAuditReport:
      type: object
      required: [generated_at, totals, items]
      properties:
        generated_at:
          type: string
          format: date-time
        totals:
          type: object
          required:
            - projects
            - rejected
            - validated
            - deployed_inactive
            - deployed_active
            - failing
            - warnings
          properties:
            projects:
              type: integer
            rejected:
              type: integer
            validated:
              type: integer
            deployed_inactive:
              type: integer
            deployed_active:
              type: integer
            failing:
              type: integer
            warnings:
              type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectAuditItem"

    # ---------- Activity ----------
    ProjectActivityItem:
      type: object
      required:
        - id
        - event_time
        - severity
        - event_type
        - message
        - n8n_workflow_id
        - execution_id
        - failed_node
        - recommended_action
        - metadata
      properties:
        id:
          type: string
          format: uuid
        event_time:
          type: string
          format: date-time
        severity:
          $ref: "#/components/schemas/Severity"
        event_type:
          $ref: "#/components/schemas/EventType"
        message:
          type: string
          nullable: true
        n8n_workflow_id:
          type: string
          nullable: true
        execution_id:
          type: string
          nullable: true
        failed_node:
          type: string
          nullable: true
        recommended_action:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    ProjectActivity:
      type: object
      required: [project_id, workflow_id, n8n_workflow_id, items]
      properties:
        project_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
          nullable: true
        n8n_workflow_id:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectActivityItem"

    # ---------- Chat history ----------
    ChatMessage:
      type: object
      required: [id, session_id, role, content, created_at]
      properties:
        id:
          type: integer
        session_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ChatRole"
        content:
          type: string
        created_at:
          type: string
          format: date-time

    # ---------- Credential bindings ----------
    CredentialRef:
      type: object
      description: Either `id` or `name` must be provided.
      properties:
        id:
          type: string
        name:
          type: string
    NodeCredentialBinding:
      type: object
      required: [credential_type]
      properties:
        node_id:
          type: string
          nullable: true
        node_name:
          type: string
          nullable: true
        credential_type:
          type: string
          minLength: 1
        id:
          type: string
        name:
          type: string
    CredentialBindingsArray:
      type: array
      items:
        $ref: "#/components/schemas/NodeCredentialBinding"
    LegacyCredentialBindingsMap:
      type: object
      description: Legacy by-credential-type record.
      additionalProperties:
        $ref: "#/components/schemas/CredentialRef"
    CredentialBindingsInput:
      oneOf:
        - $ref: "#/components/schemas/CredentialBindingsArray"
        - $ref: "#/components/schemas/LegacyCredentialBindingsMap"
    SaveCredentialBindingsRequest:
      type: object
      properties:
        bindings:
          $ref: "#/components/schemas/CredentialBindingsInput"
        credential_bindings:
          $ref: "#/components/schemas/CredentialBindingsInput"
    CredentialBindingsResponse:
      type: object
      required: [project_id, workflow_id, workflow_status, bindings, credential_bindings, legacy_bindings]
      properties:
        project_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        workflow_status:
          $ref: "#/components/schemas/WorkflowStatus"
        bindings:
          $ref: "#/components/schemas/CredentialBindingsArray"
        credential_bindings:
          $ref: "#/components/schemas/CredentialBindingsArray"
        legacy_bindings:
          $ref: "#/components/schemas/LegacyCredentialBindingsMap"

    # ---------- Deploy ----------
    DeployCheckRequest:
      type: object
      properties:
        credential_bindings:
          $ref: "#/components/schemas/CredentialBindingsInput"
    DeployRequest:
      type: object
      properties:
        activate:
          type: boolean
          default: true
        credential_bindings:
          $ref: "#/components/schemas/CredentialBindingsInput"
    CredentialField:
      type: object
      required: [name, label, type, required]
      properties:
        name:
          type: string
        label:
          type: string
        type:
          $ref: "#/components/schemas/CredentialFieldType"
        required:
          type: boolean
    DeployCredentialRequirement:
      type: object
      required:
        - node_id
        - node_name
        - credential_type
        - placeholder_credential_name
        - provisioning_mode
        - fields
        - manual_message
        - provided_binding
        - resolved_binding
        - available_credentials
        - resolved
      properties:
        node_id:
          type: string
        node_name:
          type: string
        credential_type:
          type: string
        placeholder_credential_name:
          type: string
        provisioning_mode:
          $ref: "#/components/schemas/CredentialProvisioningMode"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CredentialField"
        manual_message:
          type: string
        provided_binding:
          oneOf:
            - $ref: "#/components/schemas/CredentialRef"
            - type: "null"
        resolved_binding:
          oneOf:
            - $ref: "#/components/schemas/CredentialRef"
            - type: "null"
        available_credentials:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        resolved:
          type: boolean
    DeployPreflightResult:
      type: object
      required:
        - project_id
        - workflow_id
        - workflow_status
        - deployable
        - n8n_workflow_id
        - requirements
        - missing_credentials
        - manual_credentials
        - credentials_source_ok
        - credentials_source_error
        - stored_bindings
        - can_deploy_inactive
        - can_activate
        - can_redeploy
        - can_delete
        - n8n_credentials_url
        - n8n_workflow_url
      properties:
        project_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        workflow_status:
          $ref: "#/components/schemas/WorkflowStatus"
        deployable:
          type: boolean
        n8n_workflow_id:
          type: string
          nullable: true
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/DeployCredentialRequirement"
        missing_credentials:
          type: array
          items:
            type: object
            required: [node_id, node_name, credential_type, placeholder_credential_name]
            properties:
              node_id:
                type: string
              node_name:
                type: string
              credential_type:
                type: string
              placeholder_credential_name:
                type: string
        manual_credentials:
          type: array
          items:
            type: object
            required:
              - node_id
              - node_name
              - credential_type
              - placeholder_credential_name
              - manual_message
            properties:
              node_id:
                type: string
              node_name:
                type: string
              credential_type:
                type: string
              placeholder_credential_name:
                type: string
              manual_message:
                type: string
        credentials_source_ok:
          type: boolean
        credentials_source_error:
          type: string
          nullable: true
        stored_bindings:
          $ref: "#/components/schemas/CredentialBindingsArray"
        can_deploy_inactive:
          type: boolean
        can_activate:
          type: boolean
        can_redeploy:
          type: boolean
        can_delete:
          type: boolean
        n8n_credentials_url:
          type: string
          format: uri
        n8n_workflow_url:
          type: string
          format: uri
          nullable: true
    DeployResult:
      type: object
      required:
        - project_id
        - workflow_id
        - workflow_status
        - n8n_workflow_id
        - activated
      properties:
        project_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        workflow_status:
          type: string
          enum: [deployed_active, deployed_inactive]
        n8n_workflow_id:
          type: string
        activated:
          type: boolean
    FixWorkflowResult:
      type: object
      required: [workflow_id, workflow_status, validation_errors]
      properties:
        workflow_id:
          type: string
          format: uuid
        workflow_status:
          $ref: "#/components/schemas/WorkflowStatus"
        validation_errors:
          type: array
          items:
            type: string
    DeleteProjectResult:
      type: object
      required: [project_id, deleted, remote, cleanup_warnings]
      properties:
        project_id:
          type: string
          format: uuid
        deleted:
          type: boolean
        remote:
          type: object
          required:
            - attempted_n8n_workflow_ids
            - deactivated_n8n_workflow_ids
            - deleted_n8n_workflow_ids
            - not_found_n8n_workflow_ids
          properties:
            attempted_n8n_workflow_ids:
              type: array
              items:
                type: string
            deactivated_n8n_workflow_ids:
              type: array
              items:
                type: string
            deleted_n8n_workflow_ids:
              type: array
              items:
                type: string
            not_found_n8n_workflow_ids:
              type: array
              items:
                type: string
        cleanup_warnings:
          type: array
          items:
            type: object
            required: [n8n_workflow_id, operation, error]
            properties:
              n8n_workflow_id:
                type: string
              operation:
                type: string
                enum: [deactivate, delete]
              error:
                type: string

    # ---------- Health (project workflow) ----------
    ExecutionView:
      type: object
      required:
        - id
        - status
        - started_at
        - stopped_at
        - mode
        - duration_ms
        - failed_node
        - error_type
        - error_message
        - recommended_action
      properties:
        id:
          type: string
        status:
          type: string
          description: Raw n8n status string (e.g. `success`, `error`, `running`, `crashed`).
        started_at:
          type: string
          format: date-time
          nullable: true
        stopped_at:
          type: string
          format: date-time
          nullable: true
        mode:
          type: string
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        failed_node:
          type: string
          nullable: true
        error_type:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        recommended_action:
          type: string
          nullable: true
    HealthErrorView:
      type: object
      required: [execution_id, failed_node, error_type, severity, human_message, raw_message]
      properties:
        execution_id:
          type: string
          nullable: true
        failed_node:
          type: string
          nullable: true
        error_type:
          type: string
          nullable: true
        severity:
          oneOf:
            - $ref: "#/components/schemas/Severity"
            - type: "null"
        human_message:
          type: string
          nullable: true
        raw_message:
          type: string
          nullable: true
    ProjectWorkflowHealth:
      type: object
      required:
        - project_id
        - workflow_id
        - n8n_workflow_id
        - n8n_workflow_url
        - workflow_name
        - active
        - health_status
        - last_success_at
        - last_failure_at
        - recent_success_count
        - recent_failure_count
        - last_error
        - recommended_action
        - message
        - executions
        - last_checked_at
      properties:
        project_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
          nullable: true
        n8n_workflow_id:
          type: string
          nullable: true
        n8n_workflow_url:
          type: string
          format: uri
          nullable: true
        workflow_name:
          type: string
          nullable: true
        active:
          type: boolean
        health_status:
          $ref: "#/components/schemas/HealthStatus"
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_failure_at:
          type: string
          format: date-time
          nullable: true
        recent_success_count:
          type: integer
        recent_failure_count:
          type: integer
        last_error:
          oneOf:
            - $ref: "#/components/schemas/HealthErrorView"
            - type: "null"
        recommended_action:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        executions:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionView"
        last_checked_at:
          type: string
          format: date-time
    ProjectExecutions:
      type: object
      required: [project_id, workflow_id, n8n_workflow_id, executions]
      properties:
        project_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        n8n_workflow_id:
          type: string
        executions:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionView"
    ProjectExecutionDetails:
      type: object
      required: [project_id, workflow_id, n8n_workflow_id, execution, classified_error, safe_detail]
      properties:
        project_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        n8n_workflow_id:
          type: string
        execution:
          $ref: "#/components/schemas/ExecutionView"
        classified_error:
          type: object
          nullable: true
          additionalProperties: true
          description: Output of the error classifier (`error_type`, `severity`, `recommended_action`, `human_message`).
        safe_detail:
          type: object
          nullable: true
          additionalProperties: true
          description: Redacted execution detail safe to surface in UIs.

    # ---------- Workflow status ----------
    WorkflowStatusResponse:
      type: object
      required: [workflow, health, metrics, recent_errors, alerts, ai_suggestion]
      properties:
        workflow:
          type: object
          required: [id, project_id, status, n8n_workflow_id, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            project_id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/WorkflowStatus"
            n8n_workflow_id:
              type: string
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        health:
          type: object
          required: [is_working, last_run_status, last_run_at, unresolved_alerts]
          properties:
            is_working:
              type: boolean
            last_run_status:
              type: string
              enum: [success, failure, unknown]
            last_run_at:
              type: string
              format: date-time
              nullable: true
            unresolved_alerts:
              type: integer
        metrics:
          type: object
          required: [total_runs, failed_runs, success_rate, average_duration_ms]
          properties:
            total_runs:
              type: integer
            failed_runs:
              type: integer
            success_rate:
              type: number
              format: float
              minimum: 0
              maximum: 1
            average_duration_ms:
              type: integer
        recent_errors:
          type: array
          items:
            $ref: "#/components/schemas/RecentError"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowAlert"
        ai_suggestion:
          oneOf:
            - $ref: "#/components/schemas/AiSuggestion"
            - type: "null"
    WorkflowAlert:
      type: object
      required:
        - id
        - alert_type
        - severity
        - message
        - recommended_action
        - failed_node
        - first_seen_at
        - last_seen_at
        - status
      properties:
        id:
          type: string
          format: uuid
        alert_type:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        message:
          type: string
        recommended_action:
          type: string
          nullable: true
        failed_node:
          type: string
          nullable: true
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AlertStatus"

    # ---------- Event ingest ----------
    IncomingWorkflowEvent:
      type: object
      required: [event_type]
      properties:
        project_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
          description: Internal workflow UUID (preferred).
        n8n_workflow_id:
          type: string
          description: n8n workflow id (used as fallback to resolve the workflow).
        run_id:
          type: string
          description: Run/execution identifier.
        node_name:
          type: string
        event_type:
          $ref: "#/components/schemas/EventType"
        status:
          $ref: "#/components/schemas/EventStatus"
        severity:
          $ref: "#/components/schemas/Severity"
        message:
          type: string
        duration_ms:
          type: integer
          minimum: 0
        error_message:
          type: string
        metadata:
          type: object
          additionalProperties: true
    EventIngestResult:
      type: object
      required: [accepted, workflow_id, event_id, analysis_error]
      properties:
        accepted:
          type: boolean
        workflow_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        analysis_error:
          type: string
          nullable: true
          description: |
            Set if the AI failure analysis side-effect failed. The event itself is still
            persisted regardless.

    # ---------- Analytics ----------
    AnalyticsSnapshot:
      type: object
      required: [overview, workflows_health]
      properties:
        overview:
          type: object
          required:
            - total_projects
            - total_workflows
            - total_runs
            - failed_runs
            - success_rate
            - average_duration_ms
            - unresolved_alerts
            - healthy_workflows
            - unhealthy_workflows
          properties:
            total_projects:
              type: integer
            total_workflows:
              type: integer
            total_runs:
              type: integer
            failed_runs:
              type: integer
            success_rate:
              type: number
              minimum: 0
              maximum: 1
            average_duration_ms:
              type: integer
            unresolved_alerts:
              type: integer
            healthy_workflows:
              type: integer
            unhealthy_workflows:
              type: integer
        workflows_health:
          type: array
          items:
            type: object
            required:
              - workflow_id
              - project_id
              - project_name
              - is_working
              - last_run_status
              - failed_runs
              - total_runs
              - unresolved_alerts
            properties:
              workflow_id:
                type: string
                format: uuid
              project_id:
                type: string
                format: uuid
              project_name:
                type: string
              is_working:
                type: boolean
              last_run_status:
                type: string
                enum: [success, failure, unknown]
              failed_runs:
                type: integer
              total_runs:
                type: integer
              unresolved_alerts:
                type: integer

    # ---------- n8n facade ----------
    N8nCredentialSummary:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
    CredentialPolicyResponse:
      type: object
      required: [credential_type, label, provisioning_mode, fields, manual_message]
      properties:
        credential_type:
          type: string
        label:
          type: string
        provisioning_mode:
          $ref: "#/components/schemas/CredentialProvisioningMode"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CredentialField"
        manual_message:
          type: string
          nullable: true
    CreateN8nCredentialRequest:
      type: object
      required: [name, type, data, project_id]
      properties:
        name:
          type: string
          minLength: 2
        type:
          type: string
          minLength: 2
        data:
          type: object
          additionalProperties: true
        project_id:
          type: string
          minLength: 1

    # ---------- Debug ----------
    ProjectWorkflowDebugSnapshot:
      type: object
      required:
        - project_id
        - workflow_id
        - n8n_workflow_id
        - db_node_count
        - n8n_node_count
        - db_node_names
        - n8n_node_names
        - db_node_summaries
        - n8n_node_summaries
        - node_types_with_versions
        - normalized_node_versions
        - incompatible_nodes
        - same_counts
        - same_nodes
        - same_connections
        - same
        - n8n_url
        - n8n_exists
        - db_connection_sources_count
        - n8n_connection_sources_count
        - db_connection_keys
        - n8n_connection_keys
        - workflow_status
      properties:
        project_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
          nullable: true
        n8n_workflow_id:
          type: string
          nullable: true
        db_node_count:
          type: integer
        n8n_node_count:
          type: integer
          nullable: true
        db_node_names:
          type: array
          items:
            type: string
        n8n_node_names:
          type: array
          nullable: true
          items:
            type: string
        db_node_summaries:
          type: array
          items:
            $ref: "#/components/schemas/NodeSummary"
        n8n_node_summaries:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/NodeSummary"
        node_types_with_versions:
          type: object
          required: [db, n8n]
          properties:
            db:
              type: array
              items:
                type: string
            n8n:
              type: array
              nullable: true
              items:
                type: string
        normalized_node_versions:
          type: array
          items:
            $ref: "#/components/schemas/NormalizedNodeVersionInfo"
        incompatible_nodes:
          type: object
          required: [db, n8n]
          properties:
            db:
              type: array
              items:
                $ref: "#/components/schemas/IncompatibleNodeInfo"
            n8n:
              type: array
              nullable: true
              items:
                $ref: "#/components/schemas/IncompatibleNodeInfo"
        same_counts:
          type: boolean
        same_nodes:
          type: boolean
        same_connections:
          type: boolean
        same:
          type: boolean
        n8n_url:
          type: string
          format: uri
          nullable: true
        n8n_exists:
          type: boolean
          nullable: true
        db_connection_sources_count:
          type: integer
        n8n_connection_sources_count:
          type: integer
          nullable: true
        db_connection_keys:
          type: array
          items:
            type: string
        n8n_connection_keys:
          type: array
          nullable: true
          items:
            type: string
        workflow_status:
          oneOf:
            - $ref: "#/components/schemas/WorkflowStatus"
            - type: "null"
    NodeSummary:
      type: object
      required: [name, type, typeVersion]
      properties:
        name:
          type: string
        type:
          type: string
        typeVersion:
          type: number
          nullable: true

webhooks:
  workflowEventWebhook:
    post:
      tags: [Events]
      operationId: workflowEventWebhook
      summary: External callers POST events to /event
      description: |
        This is **not** a webhook the server emits — it documents the inverse: external
        systems (n8n itself, custom workers, n8n's `n8n-nodes-base.httpRequest`) push
        events into Ops-Radar's `POST /event` endpoint. See that operation for full
        request/response details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingWorkflowEvent"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventIngestResult"
